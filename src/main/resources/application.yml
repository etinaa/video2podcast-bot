spring:
  application:
    name: video2podcast-bot
  autoconfigure:
    # Spring AI is used for the Ollama chat model only. SummaryConfig builds it from app.ollama.*
    # (no retries, answer timeout on the request factory, no model pull), so none of the starter's
    # own beans are wanted.
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaApiAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaDecisionAutoConfiguration
      - org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
      - org.springframework.ai.model.chat.memory.autoconfigure.ChatMemoryAutoConfiguration
      - org.springframework.ai.model.tool.autoconfigure.ToolCallingAutoConfiguration
      - org.springframework.ai.retry.autoconfigure.SpringAiRetryAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
      - org.springframework.ai.model.chat.observation.autoconfigure.ChatObservationAutoConfiguration
      - org.springframework.ai.model.decision.observation.autoconfigure.DecisionObservationAutoConfiguration
      - org.springframework.ai.model.embedding.observation.autoconfigure.EmbeddingObservationAutoConfiguration

app:
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    admin-user-id: ${ADMIN_USER_ID:0}
    enabled: ${TELEGRAM_ENABLED:true}
    api-url: ${TELEGRAM_API_URL:}
  access:
    file: ${ACCESS_FILE:/data/allowed-users.json}
    request-cooldown: ${ACCESS_REQUEST_COOLDOWN:PT24H}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://host.containers.internal:11434}
    model: ${OLLAMA_MODEL:qwen3:32b}
    num-ctx: ${OLLAMA_NUM_CTX:8192}
    timeout: ${OLLAMA_TIMEOUT:PT10M}
  whisper:
    base-url: ${WHISPER_BASE_URL:http://host.containers.internal:8081}
    timeout: ${WHISPER_TIMEOUT:PT10M}
  health:
    timeout: ${HEALTH_TIMEOUT:PT3S}
  jobs:
    work-dir: ${WORK_DIR:/work}
    max-video-duration: ${MAX_VIDEO_DURATION:PT3H}
    retention: ${JOB_RETENTION:PT1H}
    metadata-timeout: ${METADATA_TIMEOUT:PT1M}
    download-timeout: ${DOWNLOAD_TIMEOUT:PT30M}
    ffmpeg-timeout: ${FFMPEG_TIMEOUT:PT30M}
    sweep-interval: ${JOB_SWEEP_INTERVAL:PT1M}
  deferred:
    retry-interval: ${DEFERRED_RETRY_INTERVAL:PT2H}
    max-attempts: ${DEFERRED_MAX_ATTEMPTS:12}
