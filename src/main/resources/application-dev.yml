# Local runs (./run.sh): only the defaults change. Any variable set in .env still wins.
app:
  access:
    file: ${ACCESS_FILE:./data/allowed-users.json}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  whisper:
    base-url: ${WHISPER_BASE_URL:http://localhost:8081}
  jobs:
    work-dir: ${WORK_DIR:./work}
